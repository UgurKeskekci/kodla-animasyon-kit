<script>
// One HTML file, no network, assets or generated images.
const FPS = 24, DURATION = 20, SEED = 7;
const W = 1080, H = 1920, TAU = Math.PI * 2;
const TYPE = {}; // System fonts keep the example self-contained.
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d', { alpha: false });
const S = { W, H, u: Math.min(W, H) };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

  g.letterSpacing = `${(px * 0.005).toFixed(2)}px`;
  return g;
}
function rng(salt) {                         // seeded PRNG (mulberry32); call rng(salt) inside draw for a fresh, fixed stream
  let a = (SEED * 2654435761 + salt * 974711) >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);

// ---- small tools
const kf = (t, keys) => {   // keyframes [[time, value or [x, y]], ...], eased between, held outside
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, a] = keys[i - 1], [t1, b] = keys[i], k = EASE.inOut((t - t0) / (t1 - t0));

  }

};
const yay = (o) => o;   // marks a plain data object
function ik(sx, sy, hx, hy, L1, L2, dis) {   // two-bone arm: the elbow, bent away from the body (dis = +1 right, -1 left)
  const dx = hx - sx, dy = hy - sy, d = Math.min(Math.hypot(dx, dy), L1 + L2 - 1e-3), a = Math.atan2(dy, dx);
  const b = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [sx + Math.cos(a - dis * b) * L1, sy + Math.sin(a - dis * b) * L1];

function kalp(g, x, y, s) { g.beginPath(); g.moveTo(x, y + s * 0.3); g.bezierCurveTo(x - s * 0.9, y - s * 0.35, x - s * 0.35, y - s * 0.95, x, y - s * 0.4);

// ---- the room: a warm white textured wall, cyan LED strings hanging, softly out of focus
function oda(g, S, t) {
  const W = S.W, H = S.H;
  const gr = g.createLinearGradient(0, 0, 0, H * 0.6); gr.addColorStop(0, '#b9ab9b'); gr.addColorStop(0.5, '#cbbfb0'); gr.addColorStop(1, '#b3a594');
  g.fillStyle = gr; g.fillRect(0, 0, W, H * 0.62);
  const r = rng(31);
  g.save(); g.filter = `blur(${(W * 0.006).toFixed(1)}px)`;
  for (let i = 0; i < 60; i++) {   // the textured plaster: soft wavy lumps
    const x = r() * W, y = r() * H * 0.58, w = W * (0.08 + r() * 0.14), h = H * (0.01 + r() * 0.02);
    g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.35)' : 'rgba(150,135,120,0.12)'; g.beginPath(); g.ellipse(x, y, w, h, r() * 0.6 - 0.3, 0, TAU); g.fill();
  }
  for (const [lx, salt] of [[0.08, 1], [0.21, 2], [0.36, 3], [0.62, 4], [0.79, 5], [0.93, 6]]) {   // the LED strings
    const x0 = W * lx, rr = rng(40 + salt);
    g.strokeStyle = 'rgba(90,120,120,0.35)'; g.lineWidth = Math.max(1, W * 0.0015); g.beginPath(); g.moveTo(x0, 0);
    for (let y = 0; y <= H * 0.56; y += H * 0.02) g.lineTo(x0 + Math.sin(y * 0.01 + salt) * W * 0.006, y); g.stroke();
    for (let y = H * 0.01; y <= H * 0.56; y += H * 0.028) {
      const x = x0 + Math.sin(y * 0.01 + salt) * W * 0.006, tw = 0.75 + 0.25 * Math.sin(t * 2.2 + y * 0.05 + salt), rad = W * 0.014;
      const gl = g.createRadialGradient(x, y, 0, x, y, rad); gl.addColorStop(0, `rgba(170,255,250,${0.95 * tw})`); gl.addColorStop(0.35, `rgba(60,230,230,${0.55 * tw})`); gl.addColorStop(1, 'rgba(40,220,220,0)');
      g.fillStyle = gl; g.fillRect(x - rad, y - rad, 2 * rad, 2 * rad); rr();
    }
  }
  g.restore();
}

// ---- the table: warm wood planks running toward the wall
function masa(g, S) {
  const W = S.W, H = S.H, y0 = H * 0.5;
  const gr = g.createLinearGradient(0, y0, 0, H); gr.addColorStop(0, '#7a4f31'); gr.addColorStop(0.4, '#93613c'); gr.addColorStop(1, '#6e4529');
  g.fillStyle = gr; g.fillRect(0, y0, W, H - y0);
  g.fillStyle = 'rgba(40,22,10,0.5)'; g.fillRect(0, y0, W, H * 0.006);   // the far edge
  g.strokeStyle = 'rgba(45,25,12,0.35)'; g.lineWidth = Math.max(1, W * 0.002);
  for (let i = -6; i <= 6; i++) { g.beginPath(); g.moveTo(W / 2 + i * W * 0.11, y0); g.lineTo(W / 2 + i * W * 0.32, H); g.stroke(); }
  const r = rng(52); g.strokeStyle = 'rgba(60,32,14,0.18)';
  for (let i = 0; i < 40; i++) { const x = r() * W, y = y0 + r() * (H - y0); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + W * 0.02, y + H * 0.01, x + W * 0.05, y + H * 0.004); g.stroke(); }
}

// ---- her, from the waist up behind the table. Proportions are the frame's: head centre (0.5 W, 0.205 H)
const KIZ = { ten: '#e7b493', tenG: '#c98d6f', sac: '#3b2419', sacA: '#5a3826', ust: '#f3e3f2', desen: '#9a6fd0', dudak: '#c66d6a', kas: '#3a2318' };
function govde(g, S, t, P) {   // torso, neck, the head; P: { bak (0 down at the slime, 1 at the camera), konus (mouth), gul (smile), egim (head tilt) }
  const W = S.W, H = S.H, cx = W * 0.5 + W * 0.006 * Math.sin(t * 1.1), u = W;
  // torso: a cream t-shirt with small lilac flowers, short sleeves
  const sy = H * 0.315, sw = u * 0.255;
  g.save(); g.fillStyle = 'rgba(60,40,30,0.28)'; g.filter = `blur(${(u * 0.025).toFixed(1)}px)`; g.beginPath(); g.ellipse(cx + u * 0.02, H * 0.36, sw * 1.2, H * 0.17, 0, 0, TAU); g.fill(); g.restore();   // her soft shadow on the wall behind
  g.fillStyle = KIZ.ust; g.beginPath(); g.moveTo(cx - sw, sy + u * 0.03); g.quadraticCurveTo(cx - sw * 0.95, sy - u * 0.01, cx - u * 0.1, sy - u * 0.02);
  g.lineTo(cx + u * 0.1, sy - u * 0.02); g.quadraticCurveTo(cx + sw * 0.95, sy - u * 0.01, cx + sw, sy + u * 0.03);
  g.lineTo(cx + u * 0.21, H * 0.56); g.lineTo(cx - u * 0.21, H * 0.56); g.closePath(); g.fill();
  const r = rng(61); g.fillStyle = KIZ.desen;
  for (let i = 0; i < 90; i++) { const x = cx + (r() - 0.5) * u * 0.46, y = sy + r() * (H * 0.56 - sy); g.globalAlpha = 0.7; for (let p = 0; p < 4; p++) { g.beginPath(); g.arc(x + Math.cos(p * 1.57) * u * 0.004, y + Math.sin(p * 1.57) * u * 0.004, u * 0.0035, 0, TAU); g.fill(); } }   // small four-petal flowers
  g.globalAlpha = 1;
  const sg = g.createLinearGradient(cx - sw, 0, cx + sw, 0); sg.addColorStop(0, 'rgba(120,90,100,0.22)'); sg.addColorStop(0.5, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(120,90,100,0.18)');
  g.fillStyle = sg; g.fillRect(cx - sw, sy - u * 0.02, sw * 2, H * 0.56 - sy);
  // neck and the scoop neckline, a thin chain
  g.fillStyle = KIZ.tenG; g.beginPath(); g.roundRect(cx - u * 0.052, H * 0.255, u * 0.104, H * 0.06, u * 0.025); g.fill();
  g.fillStyle = KIZ.ten; g.beginPath(); g.ellipse(cx, sy - u * 0.005, u * 0.1, u * 0.05, 0, 0, Math.PI); g.fill();
  g.strokeStyle = 'rgba(205,175,110,0.8)'; g.lineWidth = Math.max(1, u * 0.002); g.beginPath(); g.ellipse(cx, sy - u * 0.004, u * 0.07, u * 0.036, 0, 0.15, Math.PI - 0.15); g.stroke();
  bas(g, S, t, cx, P);
}
function bas(g, S, t, cx, P) {
  const W = S.W, H = S.H, u = W, bak = P.bak || 0, konus = P.konus || 0, gul = P.gul || 0;
  const hy = H * 0.205 - u * 0.012 * (1 - bak), rx = u * 0.088, ry = u * 0.108, egim = (P.egim || 0) + 0.04 * Math.sin(t * 0.9);
  g.save(); g.translate(cx, hy); g.rotate(egim);
  // the bun at the back, the hair behind the face
  g.fillStyle = KIZ.sac; g.beginPath(); g.ellipse(0, -ry * 1.02, rx * 0.55, ry * 0.42, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(0, -ry * 0.05, rx * 1.12, ry * 1.05, 0, 0, TAU); g.fill();
  // the face: an egg, the chin a little narrower
  const yuz = () => { g.beginPath(); g.moveTo(0, -ry); g.bezierCurveTo(rx * 0.62, -ry, rx, -ry * 0.5, rx, 0); g.bezierCurveTo(rx, ry * 0.5, rx * 0.5, ry * 0.97, 0, ry);
    g.bezierCurveTo(-rx * 0.5, ry * 0.97, -rx, ry * 0.5, -rx, 0); g.bezierCurveTo(-rx, -ry * 0.5, -rx * 0.62, -ry, 0, -ry); g.closePath(); };
  const fg = g.createRadialGradient(-rx * 0.25, -ry * 0.15, rx * 0.2, 0, 0, ry * 1.1); fg.addColorStop(0, '#f0c3a3'); fg.addColorStop(1, KIZ.tenG);
  g.fillStyle = fg; yuz(); g.fill();
  g.fillStyle = 'rgba(225,120,110,0.16)'; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * rx * 0.52, ry * 0.28, rx * 0.22, ry * 0.12, 0, 0, TAU); g.fill(); }   // cheeks
  // hair over the forehead: a centre parting, loose strands down beside the face
  g.fillStyle = KIZ.sac; g.beginPath(); g.moveTo(-rx * 1.08, ry * 0.1); g.bezierCurveTo(-rx * 1.1, -ry * 0.9, -rx * 0.35, -ry * 1.12, 0, -ry * 0.98);
  g.bezierCurveTo(rx * 0.35, -ry * 1.12, rx * 1.1, -ry * 0.9, rx * 1.08, ry * 0.1); g.bezierCurveTo(rx * 0.85, -ry * 0.45, rx * 0.4, -ry * 0.72, 0, -ry * 0.78);
  g.bezierCurveTo(-rx * 0.4, -ry * 0.72, -rx * 0.85, -ry * 0.45, -rx * 1.08, ry * 0.1); g.closePath(); g.fill();
  g.strokeStyle = KIZ.sacA; g.lineWidth = Math.max(1, u * 0.0025);
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * rx * 0.75, -ry * 0.55); g.bezierCurveTo(s * rx * 1.05, -ry * 0.1, s * rx * 0.98, ry * 0.4, s * rx * 1.02 + Math.sin(t * 1.3 + s) * u * 0.003, ry * 0.75); g.stroke(); }
  g.fillStyle = 'rgba(215,170,80,0.9)'; for (const s of [-1, 1]) { g.beginPath(); g.arc(s * rx * 1.0, ry * 0.25, u * 0.005, 0, TAU); g.fill(); }   // small gold earrings
  // eyes: looking down at the slime the lids are low; looking at us they open, dark irises, a catch-light
  const ey = -ry * 0.08 + ry * 0.04 * (1 - bak), acik = lerp(0.28, 1, bak) * (1 - 0.35 * gul);

    g.fillStyle = '#fbf6f2'; g.beginPath(); g.ellipse(ex, ey, ew, Math.max(0.5, eh), 0, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.ellipse(ex, ey, ew, Math.max(0.5, eh), 0, 0, TAU); g.clip();
    g.fillStyle = '#4a2c1c'; g.beginPath(); g.arc(ex + s * ew * 0.05, ey + ew * 0.25 * (1 - bak), ew * 0.52, 0, TAU); g.fill();
    g.fillStyle = '#1a0f0a'; g.beginPath(); g.arc(ex + s * ew * 0.05, ey + ew * 0.25 * (1 - bak), ew * 0.25, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(ex - ew * 0.15, ey - ew * 0.05, ew * 0.11, 0, TAU); g.fill(); g.restore();
    g.strokeStyle = '#2a1810'; g.lineWidth = Math.max(1.5, u * 0.004); g.beginPath(); g.ellipse(ex, ey, ew * 1.04, Math.max(0.5, eh) * 1.05, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();   // the upper lid and lashes
    g.strokeStyle = KIZ.kas; g.lineWidth = Math.max(2, u * 0.0055); g.beginPath(); g.moveTo(ex - s * ew * 0.95, ey - ew * 0.95); g.quadraticCurveTo(ex, ey - ew * (1.35 + 0.15 * bak), ex + s * ew * 1.05, ey - ew * 1.05); g.stroke();   // brows
  }
  g.strokeStyle = 'rgba(150,90,65,0.6)'; g.lineWidth = Math.max(1, u * 0.003); g.beginPath(); g.moveTo(rx * 0.02, ry * 0.05); g.quadraticCurveTo(rx * 0.12, ry * 0.3, -rx * 0.02, ry * 0.36); g.stroke();   // the nose
  // the mouth: a closed smile, opening as she speaks
  const my = ry * 0.58, mw = rx * (0.36 + 0.08 * gul), ac = konus * ry * 0.12;
  g.fillStyle = KIZ.dudak; g.beginPath(); g.moveTo(-mw, my - gul * ry * 0.04); g.quadraticCurveTo(0, my - ry * 0.05, mw, my - gul * ry * 0.05);
  g.quadraticCurveTo(0, my + ry * 0.08 + ac + gul * ry * 0.03, -mw, my - gul * ry * 0.04); g.closePath(); g.fill();
  if (ac > 0.5) { g.fillStyle = '#5a2422'; g.beginPath(); g.ellipse(0, my + ac * 0.45, mw * 0.55, ac * 0.42, 0, 0, TAU); g.fill(); }
  g.restore();
  return { cx, hy };
}

// ---- the slime: one big lilac mass on the table, glossy folds that follow the hands, glitter once it is added
function slimeSekil(S, t, eller) {   // its outline: an ellipse whose top edge lumps up and is pushed where the hands press
  const W = S.W, H = S.H, cx = W * 0.5, cy = H * 0.86, rx = W * 0.44, ry = H * 0.25, pts = [];
  for (let i = 0; i < 96; i++) {
    const a = (i / 96) * TAU, x0 = cx + Math.cos(a) * rx, y0 = cy + Math.sin(a) * ry;
    let dy = (Math.sin(a * 5 + 0.7) * 0.016 + Math.sin(a * 11 + 1.3) * 0.008 + Math.sin(a * 9 + t * 0.6) * 0.005) * H;   // lumpy, a mass not a sheet
    for (const e of eller) { const d = Math.hypot(x0 - e.x, (y0 - e.y) * 1.6) / (W * 0.16); if (d < 1) dy += (1 - d) ** 2 * e.bas * H * 0.02; }
    pts.push([x0, y0 + (Math.sin(a) < 0 ? dy : 0)]);
  }
  return pts;
}
function slime(g, S, t, eller, durum) {   // durum: { islak 0-1, sim 0-1 }
  const W = S.W, H = S.H, pts = slimeSekil(S, t, eller), yol = () => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); };
  g.save();
  g.fillStyle = 'rgba(60,30,40,0.25)'; g.filter = `blur(${(W * 0.01).toFixed(1)}px)`; g.translate(0, H * 0.008); yol(); g.fill(); g.restore();   // its shadow on the wood
  g.save(); g.translate(0, H * 0.012); g.fillStyle = '#7d55b8'; yol(); g.fill(); g.restore();   // its rounded far rim, a shade darker, below the top surface
  g.save(); yol(); g.clip();
  const gr = g.createLinearGradient(0, H * 0.6, 0, H); gr.addColorStop(0, '#c7a6ee'); gr.addColorStop(0.35, '#b38de4'); gr.addColorStop(1, '#9a72d2');
  g.fillStyle = gr; g.fillRect(0, H * 0.45, W, H * 0.6);
  for (const e of eller) {   // pressed in round each hand: a darker hollow, lighter rims
    const hg = g.createRadialGradient(e.x, e.y + H * 0.01, 0, e.x, e.y + H * 0.01, W * 0.2); hg.addColorStop(0, `rgba(95,55,150,${0.28 * e.bas + 0.1})`); hg.addColorStop(0.55, 'rgba(95,55,150,0)'); hg.addColorStop(0.75, 'rgba(235,220,255,0.12)'); hg.addColorStop(1, 'rgba(235,220,255,0)');
    g.fillStyle = hg; g.fillRect(e.x - W * 0.2, e.y - W * 0.2, W * 0.4, W * 0.4);
  }
  // the folds: glossy ridges that curve toward the nearest hand; their dark undersides first
  const r = rng(73), parl = 0.55 + 0.45 * (durum.islak || 0);
  g.save(); g.filter = `blur(${(W * 0.0025).toFixed(1)}px)`; g.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    const x = W * (0.16 + r() * 0.68), y = H * (0.65 + r() * 0.33), L = W * (0.08 + r() * 0.16), a0 = r() * TAU, ph = r() * TAU;
    let hx = 0, hy = 0, best = 1e9; for (const e of eller) { const d = Math.hypot(x - e.x, y - e.y); if (d < best) { best = d; hx = e.x; hy = e.y; } }
    const pull = clamp(1 - best / (W * 0.45)), ang = lerp(a0, Math.atan2(hy - y, hx - x), pull * 0.8) + 0.15 * Math.sin(t * 0.8 + ph);
    const x1 = x + Math.cos(ang) * L, y1 = y + Math.sin(ang) * L * 0.5, mx = (x + x1) / 2 + Math.sin(ang) * L * 0.18, my = (y + y1) / 2 - Math.cos(ang) * L * 0.1;
    g.strokeStyle = 'rgba(85,45,140,0.16)'; g.lineWidth = W * (0.022 + r() * 0.02); g.beginPath(); g.moveTo(x, y + H * 0.006); g.quadraticCurveTo(mx, my + H * 0.006, x1, y1 + H * 0.006); g.stroke();   // the fold's shaded side
    g.strokeStyle = `rgba(250,245,255,${(0.22 + r() * 0.2) * parl})`; g.lineWidth = W * (0.008 + r() * 0.008); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(mx, my, x1, y1); g.stroke();   // its lit crest
    g.strokeStyle = `rgba(255,255,255,${0.55 * parl})`; g.lineWidth = W * 0.0025; g.beginPath(); g.moveTo(lerp(x, mx, 0.4), lerp(y, my, 0.4)); g.quadraticCurveTo(mx, my, lerp(mx, x1, 0.5), lerp(my, y1, 0.5)); g.stroke();   // a sharp glint on it
  }
  g.restore();
  for (const [px, py, pr] of [[0.32, 0.7, 0.06], [0.7, 0.74, 0.05], [0.5, 0.9, 0.08], [0.22, 0.88, 0.05]]) {   // soft specular patches from the room light
    const sg = g.createRadialGradient(W * px, H * py, 0, W * px, H * py, W * pr); sg.addColorStop(0, `rgba(255,255,255,${0.35 * parl})`); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.beginPath(); g.ellipse(W * px, H * py, W * pr * 1.6, W * pr * 0.7, -0.2, 0, TAU); g.fill(); }
  if (durum.islak > 0) {   // fresh water: a glassy sheet spreading where it was poured
    const k = durum.islak, wx = W * 0.42, wy = H * 0.68, wr = W * (0.05 + 0.16 * k);
    const wg = g.createRadialGradient(wx, wy, 0, wx, wy, wr); wg.addColorStop(0, `rgba(240,245,255,${0.35 * k})`); wg.addColorStop(0.7, `rgba(220,230,255,${0.18 * k})`); wg.addColorStop(1, 'rgba(220,230,255,0)');
    g.fillStyle = wg; g.beginPath(); g.ellipse(wx, wy, wr, wr * 0.45, 0, 0, TAU); g.fill();
  }
  if (durum.sim > 0) {   // glitter in the slime, turning slowly as it is kneaded
    const rs = rng(91), n = Math.round(420 * durum.sim);
    for (let i = 0; i < n; i++) {
